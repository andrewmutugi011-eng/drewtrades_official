<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrewTrades Phoenix - REAL</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:16px}
.card{background:#1e293b;padding:16px;border-radius:12px;margin:10px 0}
button{padding:12px 20px;border-radius:8px;border:0;font-weight:bold;cursor:pointer}
#start{background:#22c55e;color:#000}
#stop{background:#ef4444;color:#fff}
input{padding:8px;border-radius:6px;border:0;margin:4px}
</style></head><body>
<h2>🔥 Phoenix REAL - Personal</h2>
<div class="card">
Balance: $<span id="bal">0.00</span> | Profit: $<span id="prof">0.00</span><br><br>
Stake: <input id="stake" value="1" type="number" style="width:60px">
Digit: <input id="digit" value="3" type="number" style="width:40px"> (DIGITOVER)<br>
TP: $<input id="tp" value="10" type="number" style="width:50px">
SL: $<input id="sl" value="5" type="number" style="width:50px"><br><br>
<button id="start" onclick="startReal()">START REAL</button>
<button id="stop" onclick="stopReal()">STOP</button>
<div>Current Stake: <span id="cur">$1.00</span> | Step: <span id="step">0</span></div>
</div>
<div class="card"><b>🧠 Smart Status</b><div id="status">Ready for REAL trading</div></div>
<div class="card"><b>📈 Feed</b><div id="feed"></div></div>

<script>
let running=false, dailyProfit=0, curStake=1, mStep=0, baseStake=1, ws=null;
const $=i=>document.getElementById(i);
function add(t,p){$('feed').innerHTML='<div>'+new Date().toLocaleTimeString()+' - '+t+' '+p+'</div>'+$('feed').innerHTML}

async function startReal(){
  if(running) return;
  baseStake=parseFloat($('stake').value)||1;
  curStake=baseStake; mStep=0; dailyProfit=0; running=true;
  $('status').innerText='Connecting to REAL backend...';
  
  // Call your REAL backend
  try{
    let r=await fetch('/api/deriv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'buy',stake:curStake,digit:$('digit').value})});
    let d=await r.json();
    console.log(d);
    $('status').innerText='REAL backend online - Starting Deriv WS for LIVE trades';
    add('Backend','OK - '+d.message);
  }catch(e){$('status').innerText='Backend error: '+e.message; return}

  // Connect directly to Deriv for REAL trades (with token from Vercel ENV handled via backend proxy is better, but this shows LIVE)
  // For true 24/7 you will set token in Vercel Env and backend will trade
  connectDeriv();
}

function connectDeriv(){
  // NOTE: For security, put your REAL token in Vercel Env DERIV_TOKEN and let backend handle trades
  // This frontend WS is for display; real buy is done by backend
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
  ws.onopen=()=>{add('WS','Connected - Ready for REAL'); $('status').innerText='Connected - Trading LIVE R_75 DIGITOVER '+$('digit').value};
  ws.onmessage=(e)=>{
    let m=JSON.parse(e.data);
    if(m.msg_type==='tick'){
      // simulate win/loss handling - replace with real contract check
    }
  };
  ws.onerror=()=>{$('status').innerText='Socket failed - Using backend fallback';};
}

function handle(profit){
  let win=profit>0;
  dailyProfit+=profit;
  $('prof').innerText=dailyProfit.toFixed(2);
  $('bal').innerText=(parseFloat($('bal').innerText)+profit).toFixed(2);
  
  if(win){curStake=baseStake; mStep=0; add('WIN','+$'+profit.toFixed(2)+' | Next: $'+curStake);}
  else{
    if(mStep>=3){curStake=baseStake; mStep=0; add('LOSS','-$'+Math.abs(profit).toFixed(2)+' Reset');}
    else{curStake=curStake*2.1; mStep++; add('LOSS','-$'+Math.abs(profit).toFixed(2)+' Martingale -> $'+curStake.toFixed(2));}
  }
  $('cur').innerText='$'+curStake.toFixed(2);
  $('step').innerText=mStep;
  
  let tp=parseFloat($('tp').value)||10, sl=parseFloat($('sl').value)||5;
  if(dailyProfit>=tp){add('TP HIT','+$'+dailyProfit.toFixed(2)+' STOPPED'); stopReal(); alert('Take Profit $'+tp+' hit!');}
  if(dailyProfit<=-sl){add('SL HIT','-$'+Math.abs(dailyProfit).toFixed(2)+' STOPPED'); stopReal(); alert('Stop Loss $'+sl+' hit!');}
}

function stopReal(){running=false; if(ws) ws.close(); $('status').innerText='Stopped - Profit: $'+dailyProfit.toFixed(2);}
</script></body></html>
