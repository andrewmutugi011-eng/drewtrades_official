<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrewTrades PRO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#fff;font-family:system-ui}.header{padding:16px;background:#0f162d;display:flex;justify-content:space-between}.logo{font-weight:900;color:#00ff88}.container{max-width:650px;margin:auto;padding:12px}.card{background:#121a2e;border:1px solid #1e2a4a;border-radius:14px;padding:14px;margin-bottom:10px}.input,.select{width:100%;padding:12px;border-radius:10px;border:1px solid #223055;background:#0a1225;color:#fff;margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:6px}.btn-green{background:#00ff88;color:#000}.btn-dark{background:#1a2440;color:#fff;border:1px solid #2a3a60}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}.b-green{background:#00ff8820;color:#00ff88}.b-red{background:#ff444420;color:#ff6b6b}.feed{max-height:220px;overflow-y:auto;background:#080d1d;border-radius:8px;padding:8px;font-size:12px}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a2540}label{font-size:11px;opacity:.7}</style></head><body>
<div class="header"><div class="logo">DREWTRADES PRO</div><div id="modeBadge" class="badge b-green">DEMO</div></div>
<div class="container">
<div class="card"><h3 style="margin:0">💰 $<span id="bal">10000.00</span> <span id="status" style="font-size:11px;opacity:.7;margin-left:6px">Ready</span></h3><input id="token" class="input" placeholder="Deriv token (optional)"><div class="grid2"><button class="btn btn-green" onclick="connectDemo()">DEMO MODE</button><button class="btn btn-dark" onclick="connectLive()">CONNECT LIVE</button></div><div id="log" style="font-size:10px;opacity:.5;margin-top:5px"></div></div>
<div class="card" style="border:2px solid #00ff88"><h4 style="margin:0 0 8px">🎯 Choose Strategy</h4>
<label>Trade Type</label><select id="cType" class="select"><option value="CALL">Rise - Rise</option><option value="PUT">Rise - Fall</option><option value="DIGITOVER">Digit - Over</option><option value="DIGITUNDER">Digit - Under</option><option value="DIGITEVEN">Digit - Even</option><option value="DIGITODD">Digit - Odd</option><option value="DIGITMATCH">Digit - Matches</option><option value="DIGITDIFF">Digit - Differs</option></select>
<div id="dBox" class="grid2" style="display:none"><div><label>Digit 0-9</label><input id="digit" class="input" type="number" min="0" max="9" value="5"></div><div><label>Stake $</label><input id="stake" class="input" type="number" value="0.35"></div></div>
<div id="nBox" class="grid2"><div><label>Stake $</label><input id="stake2" class="input" type="number" value="0.35"></div><div><label>Ticks</label><input id="dur" class="input" type="number" value="1"></div></div>
<label>Market</label><select id="market" class="select"><option value="R_10">Vol 10</option><option value="R_25">Vol 25</option><option value="R_50">Vol 50</option><option value="R_75" selected>Vol 75</option><option value="R_100">Vol 100</option><option value="BOOM1000">Boom 1000</option><option value="CRASH500">Crash 500</option></select>
<div style="margin-top:8px;background:#0a1225;padding:8px;border-radius:8px;font-size:12px">Selected: <b id="preview">CALL on R_75</b></div></div>
<div class="card"><h4 style="margin:0 0 6px">📈 Live Feed</h4><div id="feed" class="feed">Tap DEMO then ACTIVATE</div></div>
<div id="bots"></div></div>
<script>
let ws=null,demo=true,active={},bots=[{id:'phoenix',name:'Phoenix Sniper'},{id:'titan',name:'Titan Scalper'},{id:'cobra',name:'Cobra Crash'},{id:'eagle',name:'Eagle Boom'},{id:'wolf',name:'Wolf Vol'},{id:'viper',name:'Viper'},{id:'hawk',name:'Hawk'},{id:'lion',name:'Lion Master'}];
const $=id=>document.getElementById(id);
function ui(){let t=$('cType').value;let is=t.includes('DIGIT');$('dBox').style.display=is?'grid':'none';$('nBox').style.display=is?'none':'grid';let m=$('market').value;let d=$('digit').value;let txt=t;if(is && t!=='DIGITEVEN' && t!=='DIGITODD')txt+='['+d+']';txt+=' on '+m;$('preview').innerText=txt;render();}
function render(){let h='';bots.forEach(b=>{let on=active[b.id];h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${b.name}</b><span class="badge ${on?'b-green':'b-red'}">${on?'RUNNING':'STOPPED'}</span></div><div style="font-size:11px;opacity:.6">${$('preview').innerText}</div><button class="btn ${on?'btn-dark':'btn-green'}" onclick="toggleBot('${b.id}')">${on?'STOP':'ACTIVATE'}</button></div>`;});$('bots').innerHTML=h;}
function getParams(){let ct=$('cType').value,mar=$('market').value,stk=parseFloat(($('dBox').style.display!=='none'?$('stake').value:$('stake2').value))||0.35,dur=parseInt($('dur').value)||1,dig=$('digit').value;let p={amount:stk,basis:'stake',currency:'USD',duration:dur,duration_unit:'t',symbol:mar};if(ct==='CALL'||ct==='PUT')p.contract_type=ct;else if(ct==='DIGITOVER'){p.contract_type='DIGITOVER';p.barrier=dig;}else if(ct==='DIGITUNDER'){p.contract_type='DIGITUNDER';p.barrier=dig;}else if(ct==='DIGITEVEN'){p.contract_type='DIGITEVEN';}else if(ct==='DIGITODD'){p.contract_type='DIGITODD';}else if(ct==='DIGITMATCH'){p.contract_type='DIGITMATCH';p.barrier=dig;}else if(ct==='DIGITDIFF'){p.contract_type='DIGITDIFF';p.barrier=dig;}return p;}
function add(id,msg,pr){$('feed').innerHTML=`<div class="row"><span>${id} ${msg}</span><span style="color:${pr>=0?'#00ff88':'#ff6b6b'}">$${pr.toFixed(2)}</span></div>`+$('feed').innerHTML;}
function connectDemo(){demo=true;if(ws)try{ws.close();}catch(e){}$('bal').innerText='10000.00';$('modeBadge').innerText='DEMO';$('modeBadge').className='badge b-green';$('status').innerText='DEMO Ready';$('log').innerText='Choose strategy then ACTIVATE';}
function connectLive(){let t=$('token').value.trim();if(!t){alert('Paste token');return;}demo=false;ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=()=>{ws.send(JSON.stringify({authorize:t}));$('status').innerText='Authorizing...';};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.error){alert(d.error.message);$('status').innerText=d.error.message;return;}if(d.msg_type==='authorize'){$('bal').innerText=d.authorize.balance;$('modeBadge').innerText='LIVE';$('modeBadge').className='badge b-green';ws.send(JSON.stringify({balance:1,subscribe:1}));}if(d.msg_type==='balance')$('bal').innerText=Number(d.balance.balance).toFixed(2);if(d.msg_type==='proposal')ws.send(JSON.stringify({buy:d.proposal.id,price:getParams().amount}));if(d.msg_type==='buy'){add('LIVE','BOUGHT #'+d.buy.contract_id,0);ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}));}if(d.msg_type==='proposal_open_contract'&&d.proposal_open_contract.is_sold)add(d.proposal_open_contract.contract_type||'BOT',d.proposal_open_contract.profit>0?'WIN':'LOSS',d.proposal_open_contract.profit);};ws.onerror=()=>{$('status').innerText='Socket failed - use DEMO or VPN';};}
function toggleBot(id){if(!demo && !ws){alert('Tap DEMO first');return;}if(active[id]){active[id]=false;clearInterval(active[id+'_t']);}else{active[id]=true;let p=getParams();if(demo){active[id+'_t']=setInterval(()=>{let win=Math.random()>0.35;let pr=win?+(Math.random()*2+0.5).toFixed(2):-(Math.random()*0.8+0.1).toFixed(2);let b=parseFloat($('bal').innerText)+pr;$('bal').innerText=b.toFixed(2);add(id.toUpperCase(),p.contract_type+(p.barrier!==undefined?'['+p.barrier+']':'')+' '+(win?'WIN':'LOSS'),pr);},2500);}else{active[id+'_t']=setInterval(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({proposal:1},p)));},5000);ws.send(JSON.stringify(Object.assign({proposal:1},p)));}}render();}
$('cType').addEventListener('change',ui);$('market').addEventListener('change',ui);$('digit').addEventListener('input',ui);
ui();render();connectDemo();
</script></body></html>
