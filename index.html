<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrewTrades PRO - Strategy Selector</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#fff;font-family:system-ui}.header{padding:16px;background:#0f162d;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;color:#00ff88;font-size:20px}.container{max-width:650px;margin:auto;padding:12px}.card{background:#121a2e;border:1px solid #1e2a4a;border-radius:14px;padding:14px;margin-bottom:10px}.input,.select{width:100%;padding:12px;border-radius:10px;border:1px solid #223055;background:#0a1225;color:#fff;margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:6px}.btn-green{background:#00ff88;color:#000}.btn-dark{background:#1a2440;color:#fff;border:1px solid #2a3a60}.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.b-green{background:#00ff8820;color:#00ff88}.b-red{background:#ff444420;color:#ff6b6b}.feed{max-height:220px;overflow-y:auto;background:#080d1d;border-radius:8px;padding:8px;font-size:12px}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a2540}label{font-size:11px;opacity:.7;margin-top:6px;display:block}</style>
</head><body>
<div class="header"><div class="logo">DREWTRADES PRO</div><div id="modeBadge" class="badge b-red">OFFLINE</div></div>
<div class="container">

<div class="card">
<h3 style="margin:0">💰 $<span id="bal">0.00</span> <span id="status" style="font-size:11px;opacity:.7;margin-left:8px">Ready</span></h3>
<input id="token" class="input" placeholder="Deriv token (for LIVE)">
<div class="grid2"><button class="btn btn-green" onclick="connectDemo()">DEMO MODE</button><button class="btn btn-dark" onclick="connectLive()">CONNECT LIVE</button></div>
<div id="log" style="font-size:10px;opacity:.5;margin-top:6px"></div>
</div>

<div class="card" style="border:2px solid #00ff88">
<h4 style="margin:0 0 8px">🎯 STRATEGY BUILDER - Choose Trade Type</h4>

<label>Trade Type</label>
<select id="contractType" class="select" onchange="updateUI()">
<option value="CALL">Rise / Fall - Rise (CALL)</option>
<option value="PUT">Rise / Fall - Fall (PUT)</option>
<option value="CALLE">Higher / Lower - Higher</option>
<option value="PUTE">Higher / Lower - Lower</option>
<option value="DIGITOVER">Digits - Over</option>
<option value="DIGITUNDER">Digits - Under</option>
<option value="DIGITEVEN">Digits - Even</option>
<option value="DIGITODD">Digits - Odd</option>
<option value="DIGITMATCH">Digits - Matches</option>
<option value="DIGITDIFF">Digits - Differs</option>
</select>

<div id="digitBox" class="grid2" style="display:none">
<div><label>Digit (0-9)</label><input id="digit" class="input" type="number" min="0" max="9" value="5"></div>
<div><label>Stake $</label><input id="stake" class="input" type="number" value="0.35" step="0.1"></div>
</div>

<div id="normalBox" class="grid2">
<div><label>Stake $</label><input id="stake2" class="input" type="number" value="0.35" step="0.1"></div>
<div><label>Duration (ticks)</label><input id="duration" class="input" type="number" value="1" min="1" max="10"></div>
</div>

<label>Market</label>
<select id="market" class="select">
<option value="R_10">Volatility 10</option>
<option value="R_25">Volatility 25</option>
<option value="R_50">Volatility 50</option>
<option value="R_75" selected>Volatility 75</option>
<option value="R_100">Volatility 100</option>
<option value="BOOM1000">Boom 1000</option>
<option value="BOOM500">Boom 500</option>
<option value="CRASH1000">Crash 1000</option>
<option value="CRASH500">Crash 500</option>
</select>

<div style="margin-top:8px;padding:8px;background:#0a1225;border-radius:8px;font-size:11px">
Selected: <b id="preview">CALL on R_75</b><br>
<span style="opacity:.6">For Over/Under, Even/Odd, Matches/Differs - set Digit 0-9 above</span>
</div>
</div>

<div class="card"><h4 style="margin:0 0 6px">📈 Live Feed</h4><div id="tradeFeed" class="feed">No trades - Choose strategy then ACTIVATE bots</div></div>

<div id="bots"></div>

</div>
<script>
let ws=null,demo=false,active={},servers=["wss://ws.derivws.com/websockets/v3?app_id=1089","wss://ws.binaryws.com/websockets/v3?app_id=1089"];
let bots=[{id:'phoenix',name:'Phoenix Sniper'},{id:'titan',name:'Titan Scalper'},{id:'cobra',name:'Cobra Crash'},{id:'eagle',name:'Eagle Boom'},{id:'wolf',name:'Wolf Vol'},{id:'viper',name:'Viper'},{id:'hawk',name:'Hawk'},{id:'lion',name:'Lion Master'}];
function render(){
let h='';bots.forEach(b=>{let on=active[b.id];h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${b.name}</b><span class="badge ${on?'b-green':'b-red'}">${on?'RUNNING':'STOPPED'}</span></div><div style="font-size:11px;opacity:.6" id="botStrat-${b.id}">Using: ${document.getElementById('preview').innerText}</div><button class="btn ${on?'btn-dark':'btn-green'}" onclick="toggle('${b.id}')">${on?'STOP':'ACTIVATE WITH STRATEGY'}</button></div>`;});document.getElementById('bots').innerHTML=h;
}
function log(s){document.getElementById('log').innerText=s;document.getElementById('status').innerText=s;}
function updateUI(){
let t=document.getElementById('contractType').value;
let isDigit=t.includes('DIGIT');
document.getElementById('digitBox').style.display=isDigit?'grid':'none';
document.getElementById('normalBox').style.display=isDigit?'none':'grid';
let market=document.getElementById('market').value;
let digit=document.getElementById('digit').value;
let txt=t;
if(isDigit) txt+=` [${digit}]`;
txt+=` on ${market}`;
document.getElementById('preview').innerText=txt;
render();
}
function getProposalParams(){
let ct=document.getElementById('contractType').value;
let market=document.getElementById('market').value;
let stake=parseFloat(document.getElementById('digitBox').style.display!=='none'?document.getElementById('stake').value:document.getElementById('stake2').value)||0.35;
let duration=parseInt(document.getElementById('duration').value)||1;
let digit=document.getElementById('digit').value||5;
let params={amount:stake,basis:'stake',currency:'USD',duration:duration,duration_unit:'t',symbol:market};
if(ct==='CALL'||ct==='PUT'){params.contract_type=ct;}
else if(ct==='CALLE'){params.contract_type='CALL';params.barrier='+0.5';}
else if(ct==='PUTE'){params.contract_type='PUT';params.barrier='+0.5';}
else if(ct==='DIGITOVER'){params.contract_type='DIGITOVER';params.barrier=digit;}
else if(ct==='DIGITUNDER'){params.contract_type='DIGITUNDER';params.barrier=digit;}
else if(ct==='DIGITEVEN'){params.contract_type='DIGITEVEN';}
else if(ct==='DIGITODD'){params.contract_type='DIGITODD';}
else if(ct==='DIGITMATCH'){params.contract_type='DIGITMATCH';params.barrier=digit;}
else if(ct==='DIGITDIFF'){params.contract_type='DIGITDIFF';params.barrier=digit;}
return params;
}
function addTrade(id,msg,pr){let f=document.getElementById('tradeFeed');f.innerHTML=`<div class="row"><span>${id} ${msg}</span><span style="color:${pr>=0?'#00ff88':'#ff6b6b'}">$${pr.toFixed(2)}</span></div>`+f.innerHTML;}
function connectDemo(){demo=true;if(ws)ws.close();document.getElementById('bal').innerText='10000.00';document.getElementById('modeBadge').innerText='DEMO';document.getElementById('modeBadge').className='badge b-green';log('DEMO Ready - Choose strategy then ACTIVATE');}
function connectLive(){
let token=document.getElementById('token').value.trim();if(!token){alert('Paste token');return;}
demo=false;ws=new WebSocket(servers[0]);
ws.onopen=()=>{log('Connecting...');ws.send(JSON.stringify({authorize:token}));};
ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
if(d.error){log('Error: '+d.error.message);alert(d.error.message);return;}
if(d.msg_type==='authorize'){document.getElementById('bal').innerText=d.authorize.balance;document.getElementById('modeBadge').innerText='LIVE $'+d.authorize.balance;document.getElementById('modeBadge').className='badge b-green';log('LIVE Connected - Now ACTIVATE');ws.send(JSON.stringify({balance:1,subscribe:1}));}
if(d.msg_type==='balance'){document.getElementById('bal').innerText=d.balance.balance.toFixed(2);}
if(d.msg_type==='proposal'){ws.send(JSON.stringify({buy:d.proposal.id,price:getProposalParams().amount}));}
if(d.msg_type==='buy'){addTrade('LIVE','BOUGHT #'+d.buy.contract_id,0);ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}));}
if(d.msg_type==='proposal_open_contract'&&d.proposal_open_contract.is_sold){addTrade(d.proposal_open_contract.contract_type||'BOT',d.proposal_open_contract.profit>0?'WIN':'LOSS',d.proposal_open_contract.profit);}
};
ws.onerror=()=>{log('Connection failed - Use DEMO or try VPN');};
}
function toggle(id){
if(!demo&&!ws){alert('Connect DEMO or LIVE first');return;}
if(active[id]){active[id]=false;clearInterval(active[id+'_t']);log(id+' stopped');}
else{
active[id]=true;
let p=getProposalParams();
log(id+' RUNNING: '+p.contract_type+' on '+p.symbol);
if(demo){
active[id+'_t']=setInterval(()=>{
let win=Math.random()>0.35;let pr=win?+(Math.random()*2+0.5).toFixed(2):-(Math.random()*0.8+0.1).toFixed(2);
let b=parseFloat(document.getElementById('bal').innerText)+pr;
document.getElementById('bal').innerText=b.toFixed(2);
addTrade(id.toUpperCase(),p.contract_type+(p.barrier!==undefined?'['+p.barrier+']':'')+' '+(win?'WIN':'LOSS'),pr);
},3000);
}else{
active[id+'_t']=setInterval(()=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(Object.assign({proposal:1},p)));}},5000);
ws.send(JSON.stringify(Object.assign({proposal:1},p)));
}
}
render();
}
updateUI();render();
</script>
</body></html>
