<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrewTrades PRO Smart</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#fff;font-family:system-ui}.header{padding:16px;background:#0f162d;display:flex;justify-content:space-between}.logo{font-weight:900;color:#00ff88}.container{max-width:700px;margin:auto;padding:12px}.card{background:#121a2e;border:1px solid #1e2a4a;border-radius:14px;padding:14px;margin-bottom:10px}.input,.select{width:100%;padding:11px;border-radius:10px;border:1px solid #223055;background:#0a1225;color:#fff;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:6px}.btn-green{background:#00ff88;color:#000}.btn-dark{background:#1a2440;color:#fff;border:1px solid #2a3a60}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}.b-green{background:#00ff8820;color:#00ff88}.b-red{background:#ff444420;color:#ff6b6b}.b-yellow{background:#ffaa0020;color:#ffaa00}.feed{max-height:250px;overflow-y:auto;background:#080d1d;border-radius:8px;padding:8px;font-size:12px}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a2540}label{font-size:11px;opacity:.7;display:block;margin-top:4px}.switch{display:flex;align-items:center;gap:8px;margin:6px 0}.toggle{width:40px;height:22px;background:#223055;border-radius:20px;position:relative;cursor:pointer}.toggle.on{background:#00ff88}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.toggle.on::after{left:20px}.stat{display:flex;justify-content:space-between;background:#0a1225;padding:6px 10px;border-radius:8px;margin:3px 0;font-size:12px}</style></head><body>
<div class="header"><div class="logo">DREWTRADES PRO</div><div><span id="modeBadge" class="badge b-green">DEMO</span> <span id="pnlBadge" class="badge b-yellow">P&L $0</span></div></div>
<div class="container">
<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">💰 $<span id="bal">10000.00</span></h3><div style="font-size:11px"><div>WINS: <span id="wins" style="color:#00ff88">0</span> LOSS: <span id="loss" style="color:#ff6b6b">0</span></div><div id="status" style="opacity:.6">Ready</div></div></div>
<input id="token" class="input" placeholder="Deriv token for LIVE (optional)"><div class="grid2"><button class="btn btn-green" onclick="connectDemo()">DEMO MODE</button><button class="btn btn-dark" onclick="connectLive()">CONNECT LIVE</button></div></div>

<div class="card" style="border:2px solid #00ff88"><h4 style="margin:0 0 8px">🎯 Strategy + Smart Money</h4>
<div class="grid2"><div><label>Trade Type</label><select id="cType" class="select"><option value="CALL">Rise</option><option value="PUT">Fall</option><option value="DIGITOVER">Digit Over</option><option value="DIGITUNDER">Digit Under</option><option value="DIGITEVEN">Digit Even</option><option value="DIGITODD">Digit Odd</option><option value="DIGITMATCH">Digit Matches</option><option value="DIGITDIFF">Digit Differs</option></select></div><div><label>Market</label><select id="market" class="select"><option value="R_75" selected>Vol 75</option><option value="R_100">Vol 100</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option><option value="R_10">Vol 10</option><option value="BOOM1000">Boom 1000</option><option value="CRASH500">Crash 500</option></select></div></div>
<div class="grid2"><div id="dBox" style="display:none"><label>Digit 0-9</label><input id="digit" class="input" type="number" min="0" max="9" value="5"></div><div><label>Base Stake $</label><input id="stake" class="input" type="number" value="0.35" step="0.1"></div></div>
<div style="background:#0a1225;padding:8px;border-radius:8px;font-size:11px;margin-top:6px">Selected: <b id="preview">CALL on R_75</b> | <span id="bestDigit" style="color:#00ff88;cursor:pointer" onclick="findBest()">🔍 Find Best Digit (Click)</span></div></div>

<div class="card"><h4 style="margin:0 0 8px">🧠 Smart Settings</h4>
<div class="switch"><div id="martToggle" class="toggle on" onclick="this.classList.toggle('on')"></div><span style="font-size:12px">Martingale on Loss (2.1x)</span></div>
<div class="grid3"><div><label>Multiplier</label><input id="multi" class="input" type="number" value="2.1" step="0.1"></div><div><label>Max Mart Steps</label><input id="maxMart" class="input" type="number" value="3"></div><div><label>Reset on Win</label><select id="resetWin" class="select"><option value="yes" selected>Yes</option><option value="no">No</option></select></div></div>
<div class="grid2" style="margin-top:8px"><div><label>Stop Loss $ (-)</label><input id="sl" class="input" type="number" value="-10"></div><div><label>Take Profit $ (+)</label><input id="tp" class="input" type="number" value="20"></div></div>
<div class="stat"><span>Current Stake:</span><b id="curStake">$0.35</b></div><div class="stat"><span>Mart Step:</span><b id="martStep">0</b></div><div class="stat"><span>Session P&L:</span><b id="sessionPnl">$0.00</b></div>
</div>

<div class="card"><h4 style="margin:0 0 6px">📈 Live Feed</h4><div id="feed" class="feed">Set strategy + Tap DEMO then ACTIVATE</div></div>
<div id="bots"></div></div>
<script>
let ws=null,demo=true,active={},bots=[{id:'phoenix',name:'Phoenix Sniper'},{id:'titan',name:'Titan Scalper'},{id:'cobra',name:'Cobra Crash'},{id:'eagle',name:'Eagle Boom'},{id:'wolf',name:'Wolf Vol'},{id:'viper',name:'Viper'}];
let wins=0,loss=0,sessionPnl=0,curStake=0.35,martStep=0;
const $=id=>document.getElementById(id);
function ui(){let t=$('cType').value;let is=t.includes('DIGIT');$('dBox').style.display=is?'block':'none';let m=$('market').value;let d=$('digit').value;let txt=t;if(is&&t!=='DIGITEVEN'&&t!=='DIGITODD')txt+='['+d+']';txt+=' on '+m;$('preview').innerText=txt;render();updateStake();}
function updateStake(){$('curStake').innerText='$'+curStake.toFixed(2);$('martStep').innerText=martStep;}
function render(){let h='';bots.forEach(b=>{let on=active[b.id];h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${b.name}</b><span class="badge ${on?'b-green':'b-red'}">${on?'RUNNING':'STOPPED'}</span></div
