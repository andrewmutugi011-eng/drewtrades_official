<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrewTrades Phoenix - DEMO/REAL</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:16px}.card{background:#1e293b;padding:16px;border-radius:12px;margin:10px 0}button{padding:12px 20px;border-radius:8px;border:0;font-weight:bold;cursor:pointer;margin:4px}#startDemo{background:#38bdf8;color:#000}#startReal{background:#22c55e;color:#000}#stop{background:#ef4444;color:#fff}input{padding:8px;border-radius:6px;border:0;margin:4px} .mode{font-weight:bold;padding:6px 10px;border-radius:20px}.demo{background:#38bdf8;color:#000}.real{background:#22c55e;color:#000}</style></head><body>
<h2>🔥 Phoenix <span id="modeBadge" class="mode demo">DEMO</span></h2>
<div class="card">
Balance: $<span id="bal">0.00</span> | Profit: $<span id="prof">0.00</span><br><br>
Stake: <input id="stake" value="0.35" type="number" style="width:70px">
Digit: <input id="digit" value="3" type="number" style="width:45px"> DIGITOVER<br>
TP: $<input id="tp" value="10" type="number" style="width:50px">
SL: $<input id="sl" value="5" type="number" style="width:50px"><br><br>
<button id="startDemo" onclick="startTrading('demo')">START DEMO</button>
<button id="startReal" onclick="startTrading('real')">START REAL</button>
<button id="stop" onclick="stopReal()">STOP</button>
<div style="margin-top:8px">Mode: <span id="modeText">DEMO - Free testing</span> | Current: <span id="cur">$0.35</span> | Step: <span id="step">0</span></div>
</div>
<div class="card"><b>🧠 Status</b><div id="status">Ready - DEMO mode</div></div>
<div class="card"><b>📈 Feed</b><div id="feed"></div></div>
<script>
let running=false,dailyProfit=0,curStake=0.35,mStep=0,baseStake=0.35,mode='demo';
const $=i=>document.getElementById(i);
function add(t,p){$('feed').innerHTML='<div>'+new Date().toLocaleTimeString()+' - '+t+' '+p+'</div>'+$('feed').innerHTML}
async function startTrading(selectedMode){
 if(running) return; mode=selectedMode; baseStake=parseFloat($('stake').value)||0.35; curStake=baseStake; mStep=0; dailyProfit=0; running=true;
 if(mode==='demo'){$('modeBadge').innerText='DEMO';$('modeBadge').className='mode demo';$('modeText').innerText='DEMO - Free testing';$('status').innerText='DEMO running - No REAL money used';add('Mode','DEMO started - Stake $'+curStake);}
 else{$('modeBadge').innerText='REAL';$('modeBadge').className='mode real';$('modeText').innerText='REAL - Live money';$('status').innerText='REAL backend online';try{let r=await fetch('/api/deriv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check',stake:curStake,digit:$('digit').value})});let d=await r.json();add('Backend','REAL OK - '+JSON.stringify(d).slice(0,80));}catch(e){add('Backend','Error '+e.message);}}
 $('cur').innerText='$'+curStake.toFixed(2); $('step').innerText=mStep;
 // Simulated loop - replace with real contract result check
 let demoInterval=setInterval(()=>{if(!running){clearInterval(demoInterval);return;} let win=Math.random()>0.42; let profit=win?curStake*0.95:-curStake; handleTrade(profit); if(!running) clearInterval(demoInterval);}, 3000);
}
function handleTrade(profit){
 let win=profit>0; dailyProfit+=profit; $('prof').innerText=dailyProfit.toFixed(2);
 if(win){curStake=baseStake; mStep=0; add('WIN','+$'+profit.toFixed(2)+' | Next $'+curStake.toFixed(2));}
 else{if(mStep>=3){curStake=baseStake; mStep=0; add('LOSS','-$'+Math.abs(profit).toFixed(2)+' Reset');}else{curStake=curStake*2.1; mStep++; add('LOSS','-$'+Math.abs(profit).toFixed(2)+' Martingale -> $'+curStake.toFixed(2));}}
 $('cur').innerText='$'+curStake.toFixed(2); $('step').innerText=mStep;
 let tp=parseFloat($('tp').value)||10, sl=parseFloat($('sl').value)||5;
 if(dailyProfit>=tp){add('TP HIT','+$'+dailyProfit.toFixed(2)); stopReal();}
 if(dailyProfit<=-sl){add('SL HIT','-$'+Math.abs(dailyProfit).toFixed(2)); stopReal();}
}
function stopReal(){running=false; $('status').innerText='Stopped - Profit $'+dailyProfit.toFixed(2)+' ('+mode.toUpperCase()+')';}
</script></body></html>
